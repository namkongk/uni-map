# Weekly refresh: (1) re-reads every course page's international fee and course details (start dates, open/closed,
# entry requirements) into the Supabase database — the map picks them up from /api/fees within a few minutes;
# (2) scans UK universities not on the map for courses in its subjects and lists them in course_candidates for review.
# Needs repository secrets SUPABASE_URL and SUPABASE_SECRET_KEY (Settings → Secrets and variables → Actions).
name: Refresh fees & discover courses

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (08:45 in Nepal)
  workflow_dispatch:       # "Run workflow" button on the Actions tab, to run it any time

concurrency:
  group: refresh-fees
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh fees and save to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/refresh_all.mjs
      - name: Look for courses at universities not on the map
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/discover_new.mjs
